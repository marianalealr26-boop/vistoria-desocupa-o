      distHtml += '</div>';
      c.innerHTML += distHtml;

      bBal(); 
      showSidebar(false);
    }

    function distManual(id, colab) {
      if (!colab) return;
      const p = S.prots.find(function(x) { return x.id == id; });
      if (p) {
        p.colabDist = colab;
        p.dataDist = new Date().toISOString().split('T')[0];
        p.statusAcerto = 'Encerrar aluguel';
        addLog(p.contrato, 'Distribuido manualmente para ' + colab, (p.statusVist === 'Reparos pendentes' ? 'Reparos pendentes' : 'Vistoria aprovada') + ' | ' + (p.modal || '-'));
        dbSaveProt(p);
        showToast('Contrato atribuido a ' + colab + ' com sucesso!', 'success');
        rDist(document.getElementById('CNT'), document.getElementById('SB'));
      }
    }

    function bBal() { const w = document.getElementById('bal'); if (!w) return; w.innerHTML = colabs().map(function(u) { const q = S.prots.filter(function(p) { return p.colabDist === u.nome && p.statusAcerto !== 'Finalizado'; }).length; const rep = S.prots.filter(function(p) { return p.colabDist === u.nome && p.statusAcerto !== 'Finalizado' && p.statusVist === 'Reparos pendentes'; }).length; const apr = q - rep; const lastMod = S.prots.filter(function(p) { return p.colabDist === u.nome; }).slice(-1)[0]; return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="font-weight:600">' + u.nome + '</span><span style="color:var(--fg-subtle)">' + q + ' pasta' + (q !== 1 ? 's' : '') + ' · <span style="color:var(--success)">' + apr + ' apr</span> · <span style="color:var(--warning)">' + rep + ' rep</span>' + (lastMod ? ' · Última: ' + (lastMod.modal||'—') : '') + '</span></div><div class="progress-bar"><div class="progress-fill" style="width:' + Math.min(100, q * 10) + '%"></div></div></div>'; }).join(''); }

    // ── DISTRIBUIÇÃO INTELIGENTE ──────────────────────────────────────────────
    // Regras:
    // 1. Sem modalidade repetida seguida para a mesma colaboradora
    //    → Se todas já receberam essa modal, vai para quem está há mais tempo sem receber
    // 2. Equilíbrio 50/50 entre aprovada e reparos pendentes
    function dAuto() {
      const fila = S.prots.filter(function(p) { return !p.colabDist; });
      if (!fila.length) { showToast('Fila vazia', 'danger'); return; }
      const ativos = getRodizioAtivos();
      if (!ativos.length) { showToast('Nenhuma colaboradora ativa no rodizio. Ative pelo menos uma.', 'danger'); return; }

      // DATA DE CORTE — só contratos distribuídos a partir desta data contam no balanço
      const dataCorteSt = '2026-05-11';

      var distribuidos = 0;
      fila.forEach(function(p) {
        const modal = p.modal || '';
        const isReparo = p.statusVist === 'Reparos pendentes';

        // Snapshot atual de cada colaboradora — apenas contratos distribuídos após a data de corte
        var scores = ativos.map(function(u) {
          const pastasDela = S.prots.filter(function(x) {
            return x.colabDist === u.nome &&
                   x.statusAcerto !== 'Finalizado' &&
                   (x.dataDist || '') >= dataCorteSt;
          });
          const total = pastasDela.length;
          const reparos = pastasDela.filter(function(x) { return x.statusVist === 'Reparos pendentes'; }).length;
          const aprovadas = total - reparos;
          var idxUltimaModal = -1;
          for (var i = pastasDela.length - 1; i >= 0; i--) {
            if (pastasDela[i].modal === modal) { idxUltimaModal = i; break; }
          }
          const distanciaModal = idxUltimaModal === -1 ? 9999 : (pastasDela.length - 1 - idxUltimaModal);

          return {
            nome: u.nome,
            total: total,
            reparos: reparos,
            aprovadas: aprovadas,
            distanciaModal: distanciaModal
          };
        });

        // Regra 1: penalizar quem recebeu essa modal por último (distanciaModal = 0 → acabou de receber)
        // Regra 2: para pasta de reparo, preferir quem tem menos reparos (tendendo a 50%)
        //          para pasta aprovada, preferir quem tem menos aprovadas
        scores.sort(function(a, b) {
          // Prioridade 1: quem tem menos pastas no total (balanceamento base)
          if (a.total !== b.total) return a.total - b.total;
          // Prioridade 2: regra de modalidade — quem está há mais tempo sem receber essa modal vai na frente
          if (a.distanciaModal !== b.distanciaModal) return b.distanciaModal - a.distanciaModal;
          // Prioridade 3: regra 50/50 — para reparo prefere quem tem menos reparos; para aprovada prefere quem tem menos aprovadas
          if (isReparo) return a.reparos - b.reparos;
          return a.aprovadas - b.aprovadas;
        });

        const escolhida = scores[0];
        p.colabDist = escolhida.nome;
        p.dataDist = new Date().toISOString().split('T')[0];
        p.statusAcerto = 'Encerrar aluguel';
        addLog(p.contrato, 'Distribuido automaticamente para ' + escolhida.nome,
          (isReparo ? 'Reparos pendentes' : 'Vistoria aprovada') + ' | ' + (modal || '-'));
        dbSaveProt(p);
        distribuidos++;
      });

      S.rodIdx += distribuidos;
      dbSaveRodIdx();
      showToast(distribuidos + ' contrato' + (distribuidos !== 1 ? 's' : '') + ' distribuido' + (distribuidos !== 1 ? 's' : '') + ' com sucesso!', 'success');
      goTab('dist');
    }
    
    function upDistSt(id, v) { 
      const p = S.prots.find(function(x) { return x.id == id; }); 
      if (p) { 
        if (v === 'Pendente' && p.statusAcerto !== 'Pendente') p.dataPendente = new Date().toISOString().split('T')[0];
        addLog(p.contrato, 'Status alterado para "' + v + '"', 'Por: ' + (S.user ? S.user.nome : '—'));
        p.statusAcerto = v; dbSaveProt(p); showToast('Status atualizado!', 'success'); 
      } 
    }

    function upDistColab(id, novaColab) {
      const p = S.prots.find(function(x) { return x.id == id; });
      if (!p || !novaColab) return;
      const anterior = p.colabDist;
      p.colabDist = novaColab;
      // Não atualiza data_dist — mantém a data original da distribuição
      p.colabDist = novaColab;
      addLog(p.contrato, 'Colaboradora alterada: ' + anterior + ' → ' + novaColab, 'Por: ' + (S.user ? S.user.nome : '—'));
      dbSaveProt(p);
      showToast('Contrato transferido para ' + novaColab + '!', 'success');
      bBal();
    }
    
    // ── MEUS CONTRATOS com busca e filtro ────────────────────────────────────
    var meusFiltro = { q: '', status: '', prazo: '' };

    function rMeus(c, sb) { 
      const n = S.user.nome;
      const todos = S.prots.filter(function(p) { return p.colabDist === n && p.statusAcerto !== 'Finalizado'; });

      // Ordena pelo prazo mais urgente primeiro
      function prazoLimite(p) {
        if (!p.enc) return 99999;
        const prazoDias = (p.modal === 'CredAluga' || p.modal === 'Loft' || p.modal === 'Seguro Fianca') ? 30 : 45;
        return diasR(adD(p.enc, prazoDias));
      }
      todos.sort(function(a, b) { return prazoLimite(a) - prazoLimite(b); });

      const encerrar = todos.filter(function(p) { return p.statusAcerto === 'Encerrar aluguel'; }).length;
      const pendente = todos.filter(function(p) { return p.statusAcerto === 'Pendente'; }).length;
      const emAnd = todos.filter(function(p) { return p.statusAcerto === 'Em andamento'; }).length;
      const vencidos = todos.filter(function(p) { return prazoLimite(p) < 0; }).length;
      const vencendo7 = todos.filter(function(p) { const d = prazoLimite(p); return d >= 0 && d <= 7; }).length;

      // Contratos novos — distribuídos nos últimos 2 dias
      const hojeDate = new Date();
      const novos = todos.filter(function(p) {
        if (!p.data) return false;
        return Math.floor((hojeDate - new Date(p.data + 'T12:00:00')) / 86400000) <= 2;
      });

      // Finalizados do mês
      const mesStr = hojeDate.getFullYear() + '-' + String(hojeDate.getMonth()+1).padStart(2,'0');
      const finsMes = S.fins.filter(function(f) { return f.finalizadoPor === n && f.data && f.data.startsWith(mesStr); });
      const comTempo = S.fins.filter(function(f) { return f.finalizadoPor === n && f.dataPendente && f.data; });
      let tempoMed = '—';
      if (comTempo.length > 0) {
        const total = comTempo.reduce(function(acc, f) { const d = Math.ceil((new Date(f.data+'T12:00:00') - new Date(f.dataPendente+'T12:00:00')) / 86400000); return acc + (isNaN(d) ? 0 : d); }, 0);
        tempoMed = Math.round(total / comTempo.length) + ' dias';
      }

      const hora = new Date().getHours();
      const saudacao = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';

      // Totais gerais da equipe
      const totalEquipe = S.prots.filter(function(p) { return p.colabDist && p.colabDist !== 'Ja distribuido'; });
      const totalADist = S.prots.filter(function(p) { return !p.colabDist; }).length;
      const totalEncerrar = totalEquipe.filter(function(p) { return p.statusAcerto === 'Encerrar aluguel'; }).length;
      const totalPendente = totalEquipe.filter(function(p) { return p.statusAcerto === 'Pendente'; }).length;
      const totalAndamento = totalEquipe.filter(function(p) { return p.statusAcerto === 'Em andamento'; }).length;
      const totalAtivosEq = totalEncerrar + totalPendente + totalAndamento;

      c.innerHTML =
      // Barra de totais da equipe
      '<div class="card animate-in" style="padding:14px 20px;margin-bottom:16px;background:linear-gradient(135deg,#1e3a5f,#2563EB);border:none">' +
        '<div style="font-size:10px;font-weight:700;color:rgba(255,255,255,0.6);text-transform:uppercase;margin-bottom:10px">Visão Geral da Equipe</div>' +
        '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">' +
          '<div style="text-align:center"><div style="font-size:20px;font-weight:700;color:white">' + totalAtivosEq + '</div><div style="font-size:9px;color:rgba(255,255,255,0.7)">Total ativos</div></div>' +
          '<div style="text-align:center;border-left:1px solid rgba(255,255,255,0.2)"><div style="font-size:20px;font-weight:700;color:#FCD34D">' + totalADist + '</div><div style="font-size:9px;color:rgba(255,255,255,0.7)">A distribuir</div></div>' +
          '<div style="text-align:center;border-left:1px solid rgba(255,255,255,0.2)"><div style="font-size:20px;font-weight:700;color:#93C5FD">' + totalEncerrar + '</div><div style="font-size:9px;color:rgba(255,255,255,0.7)">Encerrar</div></div>' +
          '<div style="text-align:center;border-left:1px solid rgba(255,255,255,0.2)"><div style="font-size:20px;font-weight:700;color:#FCA5A5">' + totalPendente + '</div><div style="font-size:9px;color:rgba(255,255,255,0.7)">Pendente</div></div>' +
          '<div style="text-align:center;border-left:1px solid rgba(255,255,255,0.2)"><div style="font-size:20px;font-weight:700;color:#6EE7B7">' + totalAndamento + '</div><div style="font-size:9px;color:rgba(255,255,255,0.7)">Em andamento</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="card animate-in" style="padding:20px 24px;margin-bottom:20px;background:linear-gradient(135deg,#2563EB,#3B82F6);border:none">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">' +
          '<div><div style="font-size:18px;font-weight:700;color:white">' + saudacao + ', ' + n.split(' ')[0] + '! 👋</div>' +
          '<div style="font-size:13px;color:rgba(255,255,255,0.8);margin-top:4px">Você tem <strong>' + todos.length + '</strong> contrato' + (todos.length !== 1 ? 's' : '') + ' ativo' + (todos.length !== 1 ? 's' : '') + (vencidos > 0 ? ' · <strong style="color:#FCA5A5">' + vencidos + ' vencido' + (vencidos !== 1 ? 's' : '') + '</strong>' : '') + '</div></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
            (vencidos > 0 ? '<div style="background:rgba(220,38,38,0.25);border:1px solid rgba(220,38,38,0.4);border-radius:10px;padding:8px 14px;text-align:center"><div style="font-size:18px;font-weight:700;color:#FCA5A5">' + vencidos + '</div><div style="font-size:10px;color:rgba(255,255,255,0.7)">Vencidos</div></div>' : '') +
            (vencendo7 > 0 ? '<div style="background:rgba(217,119,6,0.25);border:1px solid rgba(217,119,6,0.4);border-radius:10px;padding:8px 14px;text-align:center"><div style="font-size:18px;font-weight:700;color:#FCD34D">' + vencendo7 + '</div><div style="font-size:10px;color:rgba(255,255,255,0.7)">Vencem em 7d</div></div>' : '') +
            (novos.length > 0 ? '<div style="background:rgba(5,150,105,0.25);border:1px solid rgba(5,150,105,0.4);border-radius:10px;padding:8px 14px;text-align:center"><div style="font-size:18px;font-weight:700;color:#6EE7B7">' + novos.length + '</div><div style="font-size:10px;color:rgba(255,255,255,0.7)">Novo' + (novos.length !== 1 ? 's' : '') + '</div></div>' : '') +
            '<button onclick="fazerBackup()" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Backup</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // Stats
      '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px">' +
        '<div class="stat-card animate-in stagger-1" style="padding:12px 14px"><div class="stat-value" style="font-size:20px">' + todos.length + '</div><div class="stat-label">Total</div></div>' +
        '<div class="stat-card animate-in stagger-2" style="padding:12px 14px"><div class="stat-value" style="font-size:20px;color:var(--accent)">' + encerrar + '</div><div class="stat-label">Encerrar</div></div>' +
        '<div class="stat-card animate-in stagger-3" style="padding:12px 14px"><div class="stat-value" style="font-size:20px;color:var(--warning)">' + pendente + '</div><div class="stat-label">Pendente</div></div>' +
        '<div class="stat-card animate-in stagger-4" style="padding:12px 14px"><div class="stat-value" style="font-size:20px;color:var(--success)">' + emAnd + '</div><div class="stat-label">Em andamento</div></div>' +
        '<div class="stat-card animate-in stagger-5" style="padding:12px 14px;border-left:3px solid var(--success)"><div class="stat-value" style="font-size:20px;color:var(--success)">' + finsMes.length + '</div><div class="stat-label">Finalizados/mês</div></div>' +
        '<div class="stat-card animate-in stagger-5" style="padding:12px 14px;border-left:3px solid var(--accent)"><div class="stat-value" style="font-size:15px">' + tempoMed + '</div><div class="stat-label">Tempo médio</div></div>' +
      '</div>' +

      '<div class="card animate-in">' +
        '<div class="filter-bar">' +
          '<div class="search-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input class="search-input" id="meus-q" placeholder="Buscar por contrato ou endereço..." value="' + (meusFiltro.q||'') + '" oninput="meusBusca()"></div>' +
          '<select class="filter-select" id="meus-status" onchange="meusBusca()"><option value="">Todos os status</option><option value="Encerrar aluguel" ' + (meusFiltro.status==='Encerrar aluguel'?'selected':'') + '>Encerrar aluguel</option><option value="Pendente" ' + (meusFiltro.status==='Pendente'?'selected':'') + '>Pendente</option><option value="Em andamento" ' + (meusFiltro.status==='Em andamento'?'selected':'') + '>Em andamento</option></select>' +
          '<select class="filter-select" id="meus-modal" onchange="meusBusca()"><option value="">Todas modalidades</option>' + MODAIS.map(function(m){ return '<option value="' + m + '">' + m + '</option>'; }).join('') + '</select>' +
          '<select class="filter-select" id="meus-prazo" onchange="meusBusca()"><option value="">Todos os prazos</option><option value="vencido" ' + (meusFiltro.prazo==='vencido'?'selected':'') + '>Vencidos</option><option value="alerta" ' + (meusFiltro.prazo==='alerta'?'selected':'') + '>Alerta (≤10d)</option><option value="ok" ' + (meusFiltro.prazo==='ok'?'selected':'') + '>No prazo</option></select>' +
          '<span class="filter-count" id="meus-count"></span>' +
          '<button class="btn btn-secondary btn-sm" onclick="meusLimpar()">Limpar</button>' +
        '</div>' +
        '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Contrato</th><th>Endereço</th><th>Modalidade</th><th>Encerramento</th><th>Prazo</th><th>Status</th><th>Situação</th><th>Observação</th></tr></thead><tbody id="meus-tbody"></tbody></table></div>' +
      '</div>';

      showSidebar(false);
      meusBusca();
    }

    function meusBusca() {
      meusFiltro.q = (document.getElementById('meus-q')||{value:''}).value.toLowerCase();
      meusFiltro.status = (document.getElementById('meus-status')||{value:''}).value;
      meusFiltro.prazo = (document.getElementById('meus-prazo')||{value:''}).value;
      meusFiltro.modal = (document.getElementById('meus-modal')||{value:''}).value;
      const n = S.user.nome;

      function calcPrazo(p) {
        if (!p.enc) return 99999;
        const prazoDias = (p.modal === 'CredAluga' || p.modal === 'Loft' || p.modal === 'Seguro Fianca') ? 30 : 45;
        return diasR(adD(p.enc, prazoDias));
      }

      const todos = S.prots.filter(function(p) { return p.colabDist === n && p.statusAcerto !== 'Finalizado'; });
      todos.sort(function(a, b) { return calcPrazo(a) - calcPrazo(b); });

      const filtered = todos.filter(function(p) {
        const q = meusFiltro.q;
        if (q && !((p.contrato||'').toLowerCase().includes(q) || (p.end||'').toLowerCase().includes(q))) return false;
        if (meusFiltro.status && p.statusAcerto !== meusFiltro.status) return false;
        if (meusFiltro.modal && p.modal !== meusFiltro.modal) return false;
        if (meusFiltro.prazo) {
          const d = calcPrazo(p);
          if (meusFiltro.prazo === 'vencido' && d >= 0) return false;
          if (meusFiltro.prazo === 'alerta' && (d < 0 || d > 10)) return false;
          if (meusFiltro.prazo === 'ok' && (d < 0 || d <= 10)) return false;
        }
        return true;
      });
      const cnt = document.getElementById('meus-count');
      if (cnt) cnt.textContent = filtered.length + ' de ' + todos.length + ' contrato' + (todos.length !== 1 ? 's' : '');
      const tbody = document.getElementById('meus-tbody');
      if (!tbody) return;
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>Nenhum resultado encontrado</p></div></td></tr>';
        return;
      }
      tbody.innerHTML = filtered.map(function(p) {
        const prazoDias = (p.modal === 'CredAluga' || p.modal === 'Loft' || p.modal === 'Seguro Fianca') ? 30 : 45;
        const diasRestantes = calcPrazo(p);
        let alertClass = 'prazo-ok', txt = '';
        if (diasRestantes === 99999) { txt = 'Sem data'; alertClass = ''; }
        else if (diasRestantes < 0) { txt = 'Vencido ' + Math.abs(diasRestantes) + 'd'; alertClass = 'prazo-vencido'; }
        else { txt = diasRestantes + 'd'; if (diasRestantes <= 10) alertClass = 'prazo-alerta'; }
        const encFormatted = p.enc ? p.enc.split('-').reverse().join('/') : '-';

        // Badge novo — distribuído nos últimos 2 dias
        const isNovo = p.data && Math.floor((new Date() - new Date(p.data + 'T12:00:00')) / 86400000) <= 2;

        // Cor da linha por urgência
        let rowStyle = '';
        if (diasRestantes < 0) rowStyle = 'background:rgba(220,38,38,0.05)';
        else if (diasRestantes <= 7 && diasRestantes >= 0) rowStyle = 'background:rgba(217,119,6,0.05)';
        // Badges de laudo e orçamento prontos
        const laudoPronto = p.laudo === 'Entregue';
        const orcPronto = p.statusOrc === 'Finalizado';
        const badgesLaudoOrc = (laudoPronto ? '<span class="badge badge-success" style="font-size:10px">Laudo ✅</span>' : '') +
                               (orcPronto ? '<span class="badge badge-success" style="margin-left:4px;font-size:10px">Orçamento ✅</span>' : '');

        return '<tr style="' + rowStyle + '">' +
          '<td><span class="badge badge-primary">' + p.contrato + '</span>' + (isNovo ? '<span class="badge badge-success" style="margin-left:4px;font-size:9px">Novo</span>' : '') + '</td>' +
          '<td style="font-weight:600;max-width:200px">' + p.end + '</td>' +
          '<td><span class="badge badge-neutral">' + (p.modal || '-') + '</span></td>' +
          '<td style="white-space:nowrap">' + encFormatted + '</td>' +
          '<td>' + (alertClass ? '<div class="prazo-alert ' + alertClass + '">' + txt + '</div>' : '<span style="color:var(--fg-subtle)">' + txt + '</span>') + '</td>' +
          '<td><select class="form-input form-select" style="width:145px" onchange="upMeu(\'' + p.id + '\',this.value)"><option ' + (p.statusAcerto==='Encerrar aluguel'?'selected':'') + '>Encerrar aluguel</option><option ' + (p.statusAcerto==='Pendente'?'selected':'') + '>Pendente</option><option ' + (p.statusAcerto==='Em andamento'?'selected':'') + '>Em andamento</option><option value="Finalizado">Finalizado</option></select></td>' +
          '<td style="white-space:nowrap">' + (badgesLaudoOrc || '<span style="color:var(--fg-subtle);font-size:12px">—</span>') + '</td>' +
          '<td style="min-width:280px"><textarea class="form-input form-textarea" onchange="upMeuObs(\'' + p.id + '\', this.value)" placeholder="Adicionar observação..." style="min-height:80px;resize:vertical;font-size:13px">' + (p.obs || '') + '</textarea></td>' +
        '</tr>';
      }).join('');
    }

    function meusLimpar() {
      meusFiltro = { q: '', status: '', prazo: '', modal: '' };
      const q = document.getElementById('meus-q'); if (q) q.value = '';
      const s = document.getElementById('meus-status'); if (s) s.value = '';
      const p = document.getElementById('meus-prazo'); if (p) p.value = '';
      const m = document.getElementById('meus-modal'); if (m) m.value = '';
      meusBusca();
    }

    function upMeu(id, v) { 
      const p = S.prots.find(function(x) { return x.id == id; }); 
      if (!p) return;
      if (v === 'Finalizado') {
        showConfirm('Finalizar contrato?', 'O contrato <strong>' + p.contrato + '</strong> será marcado como finalizado. Esta ação não pode ser desfeita.',
          function() {
            p.statusAcerto = 'Finalizado';
            const hoje = new Date().toISOString().split('T')[0];
            if (!p.dataPendente) p.dataPendente = hoje;
            const fin = { id: Date.now(), contrato: p.contrato, end: p.end, modal: p.modal, data: hoje, dataPendente: p.dataPendente, obs: p.obs || '', finalizadoPor: S.user ? S.user.nome : '—' };
            S.fins.push(fin);
            addLog(p.contrato, 'Contrato FINALIZADO', 'Por: ' + (S.user ? S.user.nome : '—'));
            dbSaveProt(p); dbSaveFin(fin);
            showToast('Contrato finalizado com sucesso!', 'success');
            goTab('fin');
          }
        );
        setTimeout(function() { const sel = document.querySelector('select[onchange*="\'' + id + '\'"]'); if (sel && p.statusAcerto !== 'Finalizado') sel.value = p.statusAcerto || 'Encerrar aluguel'; }, 50);
        return;
      }
      if (v === 'Pendente' && p.statusAcerto !== 'Pendente') p.dataPendente = new Date().toISOString().split('T')[0];
      addLog(p.contrato, 'Status alterado para "' + v + '"', 'Por: ' + (S.user ? S.user.nome : '—'));
      p.statusAcerto = v; dbSaveProt(p); showToast('Status atualizado!', 'success');
    }
    
    function upMeuObs(id, v) { const p = S.prots.find(function(x) { return x.id == id; }); if (p) { p.obs = v; dbSaveProt(p); } }

    function addNota(protId) {
      const input = document.getElementById('nota-input-' + protId);
      if (!input || !input.value.trim()) { showToast('Digite uma observação', 'danger'); return; }
      const p = S.prots.find(function(x) { return x.id == protId; });
      if (!p) return;
      if (!p.notas) p.notas = [];
      const now = new Date();
      const nota = {
        id: Date.now(),
        usuario: S.user ? S.user.nome : '—',
        texto: input.value.trim(),
        data: now.toISOString().split('T')[0],
        hora: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0')
      };
      p.notas.push(nota);
      input.value = '';
      addLog(p.contrato, 'Observação adicionada', nota.texto.substring(0,50) + (nota.texto.length > 50 ? '…' : ''));
      dbSaveProt(p);
      showToast('Observação salva!', 'success');
      // Atualiza o painel de notas sem recarregar a tela
      const container = document.getElementById('notas-' + protId);
      if (container) {
        container.innerHTML = p.notas.map(function(n) {
          const isOwn = n.usuario === (S.user ? S.user.nome : '');
          return '<div style="background:var(--bg);border-radius:6px;padding:6px 8px;margin-bottom:4px;font-size:12px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">' +
              '<span style="font-weight:600;color:var(--fg-muted)">' + n.usuario + '</span>' +
              '<span style="color:var(--fg-subtle);font-size:10px">' + fmtData(n.data) + ' ' + n.hora + (isOwn ? ' <span style="cursor:pointer;color:var(--danger)" onclick="excluirNota(\'' + protId + '\',\'' + n.id + '\')">✕</span>' : '') + '</span>' +
            '</div>' +
            '<div style="color:var(--fg)">' + n.texto + '</div>' +
          '</div>';
        }).join('');
      }
    }

    function excluirNota(protId, notaId) {
      const p = S.prots.find(function(x) { return x.id == protId; });
      if (!p || !p.notas) return;
      const nota = p.notas.find(function(n) { return String(n.id) === String(notaId); });
      if (!nota) return;
      if (nota.usuario !== (S.user ? S.user.nome : '')) { showToast('Você só pode excluir suas próprias observações', 'danger'); return; }
      p.notas = p.notas.filter(function(n) { return String(n.id) !== String(notaId); });
      dbSaveProt(p);
      showToast('Observação excluída!', 'success');
      const container = document.getElementById('notas-' + protId);
      if (container) {
        if (!p.notas.length) { container.innerHTML = '<p style="font-size:11px;color:var(--fg-subtle);padding:4px">Nenhuma observação.</p>'; return; }
        container.innerHTML = p.notas.map(function(n) {
          const isOwn = n.usuario === (S.user ? S.user.nome : '');
          return '<div style="background:var(--bg);border-radius:6px;padding:6px 8px;margin-bottom:4px;font-size:12px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">' +
              '<span style="font-weight:600;color:var(--fg-muted)">' + n.usuario + '</span>' +
              '<span style="color:var(--fg-subtle);font-size:10px">' + fmtData(n.data) + ' ' + n.hora + (isOwn ? ' <span style="cursor:pointer;color:var(--danger)" onclick="excluirNota(\'' + protId + '\',\'' + n.id + '\')">✕</span>' : '') + '</span>' +
            '</div>' +
            '<div style="color:var(--fg)">' + n.texto + '</div>' +
          '</div>';
        }).join('');
      }
    }

    // ── RELATÓRIO MENSAL ──────────────────────────────────────────────────────
    function rRelatorio(c, sb) {
      const now = new Date();
      let mesAtual = now.getMonth();
      let anoAtual = now.getFullYear();

      function renderRel() {
        const mesNome = ML[mesAtual] + ' ' + anoAtual;
        const mesStr = anoAtual + '-' + String(mesAtual+1).padStart(2,'0');

        // Finalizados no mês
        const finMes = S.fins.filter(function(f) { return f.data && f.data.startsWith(mesStr); });

        // Ativos no mês (distribuídos e não finalizados)
        const ativosMes = S.prots.filter(function(p) { return p.colabDist && p.statusAcerto !== 'Finalizado'; });

        // Vencidos
        const vencidos = S.prots.filter(function(p) {
          if (!p.colabDist || p.statusAcerto === 'Finalizado' || !p.enc) return false;
          const prazoDias = (p.modal === 'CredAluga' || p.modal === 'Loft' || p.modal === 'Seguro Fianca') ? 30 : 45;
          return diasR(adD(p.enc, prazoDias)) < 0;
        });

        // Laudos pendentes
        const laudos = getLaudosPendentes();

        // Por colaboradora
        const colabStats = colabs().map(function(u) {
          const fin = finMes.filter(function(f) { return f.finalizadoPor === u.nome; }).length;
          const ativos = ativosMes.filter(function(p) { return p.colabDist === u.nome; }).length;
          const venc = vencidos.filter(function(p) { return p.colabDist === u.nome; }).length;
          const tempos = S.fins.filter(function(f) { return f.finalizadoPor === u.nome && f.dataPendente && f.data && f.data.startsWith(mesStr); });
          let tempoMed = '—';
          if (tempos.length > 0) {
            const total = tempos.reduce(function(acc, f) { return acc + Math.ceil((new Date(f.data+'T12:00:00') - new Date(f.dataPendente+'T12:00:00')) / 86400000); }, 0);
            tempoMed = Math.round(total / tempos.length) + 'd';
          }
          return { nome: u.nome, cor: u.cor, ini: u.ini, fin: fin, ativos: ativos, venc: venc, tempoMed: tempoMed };
        }).filter(function(u) { return u.fin > 0 || u.ativos > 0; });

        c.innerHTML = '<div class="section-header animate-in"><div><h1 class="section-title">Relatório Mensal</h1><p class="section-subtitle">' + mesNome + '</p></div>' +
        '<div style="display:flex;gap:8px;margin-left:auto">' +
          '<button class="btn btn-secondary btn-sm" onclick="relMov(-1)">← Anterior</button>' +
          '<button class="btn btn-secondary btn-sm" onclick="relMov(1)">Próximo →</button>' +
          '<button class="btn btn-primary btn-sm" onclick="exportarRelatorio()">⬇ Exportar Excel</button>' +
        '</div></div>' +

        // Cards resumo
        '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px">' +
          '<div class="stat-card animate-in stagger-1" style="border-left:4px solid var(--success)"><div class="stat-content"><div class="stat-value" style="color:var(--success)">' + finMes.length + '</div><div class="stat-label">Finalizados no mês</div></div></div>' +
          '<div class="stat-card animate-in stagger-2" style="border-left:4px solid var(--accent)"><div class="stat-content"><div class="stat-value">' + ativosMes.length + '</div><div class="stat-label">Contratos ativos</div></div></div>' +
          '<div class="stat-card animate-in stagger-3" style="border-left:4px solid var(--danger)"><div class="stat-content"><div class="stat-value" style="color:var(--danger)">' + vencidos.length + '</div><div class="stat-label">Vencidos</div></div></div>' +
          '<div class="stat-card animate-in stagger-4" style="border-left:4px solid var(--warning)"><div class="stat-content"><div class="stat-value" style="color:var(--warning)">' + laudos.length + '</div><div class="stat-label">Laudos pendentes</div></div></div>' +
        '</div>' +

        // Por colaboradora
        '<div class="card animate-in" style="margin-bottom:20px"><div style="padding:16px 20px;border-bottom:1px solid var(--border)"><h3 style="font-size:13px;font-weight:700;color:var(--fg-subtle);text-transform:uppercase">Desempenho por Colaboradora</h3></div>' +
        (colabStats.length ?
        '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Colaboradora</th><th>Finalizados no mês</th><th>Contratos ativos</th><th>Vencidos</th><th>Tempo médio acerto</th></tr></thead><tbody>' +
        colabStats.map(function(u) {
          return '<tr>' +
            '<td><div style="display:flex;align-items:center;gap:8px"><div class="avatar ' + AVATAR_COLORS[u.cor%AVATAR_COLORS.length] + '" style="width:28px;height:28px;font-size:10px">' + u.ini + '</div><span style="font-weight:600">' + u.nome + '</span></div></td>' +
            '<td><span style="font-size:18px;font-weight:700;color:var(--success)">' + u.fin + '</span></td>' +
            '<td>' + u.ativos + '</td>' +
            '<td>' + (u.venc > 0 ? '<span style="color:var(--danger);font-weight:600">' + u.venc + '</span>' : '0') + '</td>' +
            '<td>' + u.tempoMed + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>'
        : '<p style="padding:20px;color:var(--fg-subtle);text-align:center">Nenhum dado para este mês.</p>') +
        '</div>' +

        // Finalizados do mês
        '<div class="card animate-in"><div style="padding:16px 20px;border-bottom:1px solid var(--border)"><h3 style="font-size:13px;font-weight:700;color:var(--fg-subtle);text-transform:uppercase">Contratos Finalizados — ' + mesNome + ' (' + finMes.length + ')</h3></div>' +
        (finMes.length ?
        '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Contrato</th><th>Endereço</th><th>Modalidade</th><th>Finalizado por</th><th>Data</th><th>Tempo acerto</th></tr></thead><tbody>' +
        finMes.map(function(f) {
          const dias = f.dataPendente && f.data ? Math.ceil((new Date(f.data+'T12:00:00') - new Date(f.dataPendente+'T12:00:00')) / 86400000) : null;
          return '<tr><td><span class="badge badge-primary">' + f.contrato + '</span></td><td style="font-weight:600">' + f.end + '</td><td><span class="badge badge-neutral">' + (f.modal||'-') + '</span></td><td>' + (f.finalizadoPor||'—') + '</td><td>' + fmtData(f.data) + '</td><td>' + (dias !== null && !isNaN(dias) ? dias + 'd' : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<p style="padding:20px;color:var(--fg-subtle);text-align:center">Nenhum contrato finalizado neste mês.</p>') +
        '</div>';

        // Salva estado para exportação
        window._relState = { mesNome, finMes, ativosMes, vencidos, laudos, colabStats };
        showSidebar(false);
      }

      window._relMes = mesAtual;
      window._relAno = anoAtual;

      window.relMov = function(d) {
        mesAtual += d;
        if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
        if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
        renderRel();
      };

      renderRel();
    }

    function exportarRelatorio() {
      if (!window._relState) return;
      const { mesNome, finMes, ativosMes, vencidos, laudos, colabStats } = window._relState;

      let csv = '\uFEFF'; // BOM para Excel reconhecer UTF-8

      csv += 'RELATÓRIO MENSAL — ' + mesNome + '\n\n';

      csv += 'RESUMO\n';
      csv += 'Finalizados no mês,' + finMes.length + '\n';
      csv += 'Contratos ativos,' + ativosMes.length + '\n';
      csv += 'Vencidos,' + vencidos.length + '\n';
      csv += 'Laudos pendentes,' + laudos.length + '\n\n';

      csv += 'DESEMPENHO POR COLABORADORA\n';
      csv += 'Colaboradora,Finalizados,Ativos,Vencidos,Tempo médio\n';
      colabStats.forEach(function(u) { csv += u.nome + ',' + u.fin + ',' + u.ativos + ',' + u.venc + ',' + u.tempoMed + '\n'; });

      csv += '\nCONTRATOS FINALIZADOS\n';
      csv += 'Contrato,Endereço,Modalidade,Finalizado por,Data,Tempo acerto\n';
      finMes.forEach(function(f) {
        const dias = f.dataPendente && f.data ? Math.ceil((new Date(f.data+'T12:00:00') - new Date(f.dataPendente+'T12:00:00')) / 86400000) : '';
        csv += '"' + f.contrato + '","' + (f.end||'') + '","' + (f.modal||'') + '","' + (f.finalizadoPor||'') + '","' + fmtData(f.data) + '","' + (isNaN(dias) ? '' : dias + 'd') + '"\n';
      });

      csv += '\nCONTRATOS VENCIDOS\n';
      csv += 'Contrato,Endereço,Modalidade,Colaboradora,Encerramento\n';
      vencidos.forEach(function(p) { csv += '"' + p.contrato + '","' + (p.end||'') + '","' + (p.modal||'') + '","' + (p.colabDist||'') + '","' + fmtData(p.enc) + '"\n'; });

      csv += '\nLAUDOS PENDENTES\n';
      csv += 'Contrato,Endereço,Modalidade,Status Vistoria,Encerramento\n';
      laudos.forEach(function(p) { csv += '"' + p.contrato + '","' + (p.end||'') + '","' + (p.modal||'') + '","' + (p.statusVist||'') + '","' + fmtData(p.enc) + '"\n'; });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'relatorio-' + mesNome.replace(' ', '-').toLowerCase() + '.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Relatório exportado!', 'success');
    }
    
    function rFin(c, sb) { 
      const canRevert = S.user && (S.user.role === 'admin' || S.user.role === 'gestora_desocupacao');
      c.innerHTML = '<div class="section-header animate-in"><div><h1 class="section-title">Finalizados</h1></div></div><div class="card animate-in"><div class="filter-bar"><div class="search-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input class="search-input" id="fin-q" placeholder="Buscar por contrato ou endereço..." oninput="rlFin()"></div><span class="filter-count" id="fin-count"></span></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Contrato</th><th>Endereço</th><th>Modalidade</th><th>Data Finalização</th><th>Finalizado por</th><th>Tempo Acerto</th>' + (canRevert ? '<th>Ação</th>' : '') + '</tr></thead><tbody id="fb"></tbody></table></div></div>'; 
      rlFin(); 
      sb.innerHTML = '<div class="card" style="padding:20px;text-align:center"><div style="font-size:42px;font-weight:700;color:var(--accent);font-family:\'Fraunces\',serif">' + S.fins.length + '</div><div style="font-size:12px;color:var(--fg-subtle)">contratos finalizados</div></div>'; 
      showSidebar(true); 
    }
    
    function rlFin() { 
      const b = document.getElementById('fb'); 
      if (!b) return;
      const canRevert = S.user && (S.user.role === 'admin' || S.user.role === 'gestora_desocupacao');
      const q = ((document.getElementById('fin-q')||{value:''}).value||'').toLowerCase();
      const list = S.fins.slice().reverse().filter(function(f) {
        if (!q) return true;
        return (f.contrato||'').toLowerCase().includes(q) || (f.end||'').toLowerCase().includes(q);
      });
      const cnt = document.getElementById('fin-count');
      if (cnt) cnt.textContent = list.length + ' de ' + S.fins.length + ' contrato' + (S.fins.length !== 1 ? 's' : '');
      b.innerHTML = list.length ? list.map(function(f) {
        let tempoAcerto = '-';
        if (f.dataPendente && f.data) {
          const ini = new Date(f.dataPendente + 'T12:00:00');
          const fim = new Date(f.data + 'T12:00:00');
          const dias = Math.ceil((fim - ini) / 86400000);
          tempoAcerto = isNaN(dias) ? '-' : (dias + ' dia' + (dias !== 1 ? 's' : ''));
        }
        const revertBtn = canRevert ? '<td><button class="btn btn-secondary btn-sm" onclick="revertFinalizado(\'' + f.id + '\')" title="Reverter para Em andamento">↩ Reverter</button></td>' : '';
        return '<tr><td><span class="badge badge-primary">' + f.contrato + '</span></td><td style="font-weight:600">' + f.end + '</td><td><span class="badge badge-neutral">' + (f.modal || '-') + '</span></td><td>' + fmtData(f.data) + '</td><td><span style="font-size:13px;font-weight:500">' + (f.finalizadoPor || '—') + '</span></td><td>' + tempoAcerto + '</td>' + revertBtn + '</tr>'; 
      }).join('') : '<tr><td colspan="' + (canRevert ? '7' : '6') + '" style="padding:24px;color:var(--fg-subtle)">Nenhum contrato finalizado.</td></tr>'; 
    }

    async function revertFinalizado(id) {
      const f = S.fins.find(function(x) { return x.id == id; });
      if (!f) return;
      if (!confirm('Reverter "' + f.contrato + ' - ' + f.end + '" para Em andamento?')) return;
      
      // Restaura o protocolo com status Em andamento
      const pExist = S.prots.find(function(p) { return p.contrato === f.contrato; });
      if (pExist) {
        pExist.statusAcerto = 'Em andamento';
        await dbSaveProt(pExist);
      } else {
        // Cria novo protocolo
        const novoProt = { id: Date.now(), agId: 0, contrato: f.contrato, end: f.end, data: new Date().toISOString().split('T')[0], modal: f.modal||'', statusVist: 'Aprovada', enc: '', limite: '', laudo: 'Nao', laudoPendente: false, colabDist: f.finalizadoPor||'', dataDist: new Date().toISOString().split('T')[0], statusAcerto: 'Em andamento', dataPendente: null, obs: '', statusOrc: 'Aguardando orcamento', obsOrc: '', notas: [] };
        S.prots.push(novoProt);
        await dbSaveProt(novoProt);
      }

      // Remove dos finalizados
      await fetch(SB_URL + '/rest/v1/finalizados?id=eq.' + id, { method: 'DELETE', headers: SB_HDR });
      S.fins = S.fins.filter(function(x) { return x.id != id; });
      
      addLog(f.contrato, 'Revertido de Finalizado para Em andamento', 'Por: ' + (S.user ? S.user.nome : '—'));
      showToast('Contrato revertido para Em andamento!', 'success');
      rlFin();
    }
    
    // ── BUSCA GLOBAL ─────────────────────────────────────────────────────────
    function rBusca(c, sb) {
      c.innerHTML = '<div class="section-header animate-in"><div><h1 class="section-title">Busca Global</h1><p class="section-subtitle">Digite o numero do contrato ou parte do endereço</p></div></div>' +
      '<div class="global-search-wrap animate-in">' +
        '<svg class="global-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>' +
        '<input class="global-search-input" id="gs-input" placeholder="Ex: 26978 ou Rua Castro..." oninput="gsBusca()" autofocus>' +
      '</div>' +
      '<div id="gs-results" class="card animate-in"></div>';
      showSidebar(false);
      setTimeout(function() { const el = document.getElementById('gs-input'); if (el) el.focus(); }, 100);
    }

    function gsBusca() {
      const q = (document.getElementById('gs-input') || {value:''}).value.trim().toLowerCase();
      const res = document.getElementById('gs-results');
      if (!res) return;
      if (q.length < 2) { res.innerHTML = '<p style="padding:24px;color:var(--fg-subtle);text-align:center">Digite pelo menos 2 caracteres para buscar.</p>'; return; }

      const resultados = [];

      // Busca em agendamentos
      S.ags.forEach(function(a) {
        if ((a.contrato||'').toLowerCase().includes(q) || (a.end||'').toLowerCase().includes(q)) {
          resultados.push({ tipo: 'agendamento', contrato: a.contrato, end: a.end, info: 'Agendamento · ' + a.status + (a.vistoriador ? ' · Vistoriador: ' + a.vistoriador : ''), cor: 'badge-primary', data: a.dataCad });
        }
      });

      // Busca em protocolos
      S.prots.forEach(function(p) {
        if ((p.contrato||'').toLowerCase().includes(q) || (p.end||'').toLowerCase().includes(q)) {
          resultados.push({ tipo: 'protocolo', contrato: p.contrato, end: p.end, info: 'Protocolo · ' + (p.statusVist||'-') + ' · ' + (p.modal||'-') + (p.colabDist ? ' · Resp: ' + p.colabDist : ''), cor: p.statusVist === 'Reparos pendentes' ? 'badge-warning' : 'badge-success', data: p.data });
        }
      });

      // Busca em finalizados
      S.fins.forEach(function(f) {
        if ((f.contrato||'').toLowerCase().includes(q) || (f.end||'').toLowerCase().includes(q)) {
          resultados.push({ tipo: 'finalizado', contrato: f.contrato, end: f.end, info: 'Finalizado · ' + (f.modal||'-') + ' · ' + fmtData(f.data), cor: 'badge-neutral', data: f.data });
        }
      });

      if (!resultados.length) {
        res.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>Nenhum resultado para "<strong>' + q + '</strong>"</p></div>';
        return;
      }

      // Agrupa por contrato para mostrar linha do tempo completa
      const porContrato = {};
      resultados.forEach(function(r) {
        if (!porContrato[r.contrato]) porContrato[r.contrato] = { end: r.end, itens: [] };
        porContrato[r.contrato].itens.push(r);
      });

      res.innerHTML = '<div style="padding:14px 20px;border-bottom:1px solid var(--border);font-size:12px;color:var(--fg-subtle)">' + resultados.length + ' resultado' + (resultados.length !== 1 ? 's' : '') + ' encontrado' + (resultados.length !== 1 ? 's' : '') + '</div>' +
      Object.entries(porContrato).map(function(entry) {
        const contrato = entry[0], dados = entry[1];
        return '<div class="result-card" onclick="verTimeline(\'' + contrato + '\')">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
            '<span class="badge badge-primary" style="font-size:13px">#' + contrato + '</span>' +
            '<span style="font-weight:600;font-size:14px">' + dados.end + '</span>' +
            '<span style="margin-left:auto;font-size:11px;color:var(--accent);font-weight:600">Ver linha do tempo →</span>' +
          '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
            dados.itens.map(function(i) { return '<span class="badge ' + i.cor + '">' + i.tipo.charAt(0).toUpperCase() + i.tipo.slice(1) + '</span><span style="font-size:11px;color:var(--fg-muted)">' + i.info + '</span>'; }).join('<span style="color:var(--border-strong);margin:0 4px">|</span>') +
          '</div>' +
        '</div>';
      }).join('');
    }

    // ── LINHA DO TEMPO POR CONTRATO ───────────────────────────────────────────
    function verTimeline(contrato) {
      const c = document.getElementById('CNT');
      const sb = document.getElementById('SB');

      // Coleta todos os eventos do contrato
      const eventos = [];
      const ag = S.ags.filter(function(a) { return String(a.contrato) === String(contrato); });
      const prot = S.prots.filter(function(p) { return String(p.contrato) === String(contrato); });
      const fin = S.fins.filter(function(f) { return String(f.contrato) === String(contrato); });
      const logsC = S.logs.filter(function(l) { return String(l.contrato) === String(contrato); });

      ag.forEach(function(a) {
        eventos.push({ ts: new Date(a.dataCad + 'T' + (a.horaCad||'00:00')).getTime(), tipo: 'ag', titulo: 'Agendamento registrado', detalhe: a.end + ' · ' + (a.tipo === 'acompanhada' ? 'Acompanhada com ' + a.acomp : 'Nao acompanhada') + (a.colab ? ' · Colab: ' + a.colab : ''), data: fmtData(a.dataCad), hora: a.horaCad, status: a.status, dot: 'tl-dot-blue' });
        if (a.vistoriador && a.status !== 'Aguardando') eventos.push({ ts: new Date(a.dataCad + 'T' + (a.horaCad||'00:00')).getTime() + 1, tipo: 'vist', titulo: 'Vistoriador atribuido: ' + a.vistoriador, detalhe: 'Status: ' + a.status, data: fmtData(a.dataCad), hora: a.horaCad, dot: 'tl-dot-amber' });
        if (a.status === 'Concluido') eventos.push({ ts: new Date(a.dataCad + 'T' + (a.horaCad||'00:00')).getTime() + 2, tipo: 'conc', titulo: 'Vistoria concluida', detalhe: 'Vistoriador: ' + (a.vistoriador||'-'), data: fmtData(a.dataCad), hora: a.horaCad, dot: 'tl-dot-green' });
        if (a.status === 'Aguardando retorno') eventos.push({ ts: new Date(a.dataCad + 'T' + (a.horaCad||'00:00')).getTime() + 2, tipo: 'ret', titulo: 'Aguardando retorno — reparos pendentes', detalhe: '', data: fmtData(a.dataCad), hora: a.horaCad, dot: 'tl-dot-red' });
      });
      prot.forEach(function(p) {
        eventos.push({ ts: new Date(p.data + 'T12:00:00').getTime(), tipo: 'prot', titulo: 'Protocolo registrado', detalhe: 'Modalidade: ' + (p.modal||'-') + ' · Vistoria: ' + (p.statusVist||'-') + ' · Encerramento: ' + fmtData(p.enc), data: fmtData(p.data), hora: '', dot: p.statusVist === 'Reparos pendentes' ? 'tl-dot-amber' : 'tl-dot-green' });
        if (p.colabDist) eventos.push({ ts: new Date(p.data + 'T12:00:01').getTime(), tipo: 'dist', titulo: 'Distribuido para ' + p.colabDist, detalhe: 'Status: ' + (p.statusAcerto||'-'), data: fmtData(p.data), hora: '', dot: 'tl-dot-blue' });
        if (p.statusOrc === 'Finalizado') eventos.push({ ts: new Date(p.data + 'T12:00:02').getTime(), tipo: 'orc', titulo: 'Orcamento finalizado', detalhe: p.obsOrc || '', data: fmtData(p.data), hora: '', dot: 'tl-dot-green' });
      });
      fin.forEach(function(f) {
        eventos.push({ ts: new Date(f.data + 'T23:00:00').getTime(), tipo: 'fin', titulo: 'Contrato FINALIZADO', detalhe: 'Modalidade: ' + (f.modal||'-'), data: fmtData(f.data), hora: '', dot: 'tl-dot-green' });
      });
      logsC.forEach(function(l) {
        eventos.push({ ts: l.ts, tipo: 'log', titulo: l.acao, detalhe: (l.detalhe ? l.detalhe + ' · ' : '') + 'Por: ' + l.usuario, data: fmtData(l.data), hora: l.hora, dot: 'tl-dot-gray' });
      });

      eventos.sort(function(a, b) { return a.ts - b.ts; });

      const endAtual = ag.length ? ag[0].end : (prot.length ? prot[0].end : '');

      c.innerHTML = '<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px"><button class="btn btn-secondary btn-sm" onclick="goTab(\'busca\')">← Voltar</button><div><h1 class="section-title font-display">Contrato #' + contrato + '</h1><p style="font-size:14px;color:var(--fg-subtle)">' + endAtual + '</p></div></div>' +
      '<div class="card animate-in">' +
        '<div style="padding:16px 20px;border-bottom:1px solid var(--border)"><h3 style="font-size:12px;font-weight:700;color:var(--fg-subtle);text-transform:uppercase">Linha do Tempo · ' + eventos.length + ' evento' + (eventos.length !== 1 ? 's' : '') + '</h3></div>' +
        (eventos.length ? '<div class="timeline">' + eventos.map(function(e) {
          return '<div class="tl-item"><div class="tl-dot ' + e.dot + '">·</div><div class="tl-body"><div class="tl-action">' + e.titulo + '</div><div class="tl-meta">' + e.data + (e.hora ? ' às ' + e.hora : '') + '</div>' + (e.detalhe ? '<div class="tl-detail">' + e.detalhe + '</div>' : '') + '</div></div>';
        }).join('') + '</div>' : '<p style="padding:24px;color:var(--fg-subtle)">Nenhum evento registrado.</p>') +
      '</div>';

      showSidebar(false);
    }

    // ── SEGURO FIANÇA — listagem restrita ─────────────────────────────────────
    function rFianca(c, sb) {
      const MODAIS_FIANCA = ['CredAluga', 'Loft', 'Seguro Fianca'];

      // Fonte principal: protocolos (aparece quando protocolo é preenchido)
      const contratos = {};
      S.prots.forEach(function(p) {
        if (!p.modal || MODAIS_FIANCA.indexOf(p.modal) < 0) return;
        // Busca agendamento correspondente para pegar chaves_informadas e responsavel
        const ag = S.ags.find(function(a) { return String(a.contrato) === String(p.contrato); });
        contratos[p.contrato] = {
          contrato: p.contrato,
          end: p.end,
          modal: p.modal,
          enc: p.enc, // data de encerramento do aluguel
          statusVist: p.statusVist,
          colabDist: p.colabDist || '',
          chavesInformadas: ag ? (ag.chavesInformadas || 'Nao') : 'Nao',
          responsavelFianca: ag ? (ag.responsavelFianca || '') : '',
          agId: ag ? ag.id : null
        };
      });

      const lista = Object.values(contratos).sort(function(a, b) { return (b.enc||'').localeCompare(a.enc||''); });
      const canEdit = S.user && (S.user.role === 'colaboradora' || S.user.role === 'admin' || S.user.role === 'gestor_vistoria' || S.user.role === 'gestora_desocupacao' || S.user.role === 'seguro_fianca');
      const modalBadge = function(m) {
        if (m === 'CredAluga') return '<span class="badge badge-primary">CredAluga</span>';
        if (m === 'Loft') return '<span class="badge badge-warning">Loft</span>';
        if (m === 'Seguro Fianca') return '<span class="badge badge-success">Seguro Fianca</span>';
        return '<span class="badge badge-neutral">' + (m||'-') + '</span>';
      };

      c.innerHTML = '<div class="section-header animate-in"><div><h1 class="section-title">Contratos Fianca</h1><p class="section-subtitle">Contratos nas modalidades CredAluga, Loft e Seguro Fianca</p></div></div>' +
      '<div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">' +
        ['CredAluga','Loft','Seguro Fianca'].map(function(m) {
          const qtd = lista.filter(function(x) { return x.modal === m; }).length;
          return '<div class="stat-card animate-in" style="flex:1;min-width:140px;padding:14px 18px"><div class="stat-content"><div class="stat-value" style="font-size:24px">' + qtd + '</div><div class="stat-label">' + m + '</div></div></div>';
        }).join('') +
      '</div>' +
      '<div class="card animate-in">' +
        '<div class="filter-bar">' +
          '<div class="search-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input class="search-input" id="fi-q" placeholder="Buscar por contrato ou endereço..." oninput="fiBusca()"></div>' +
          '<select class="filter-select" id="fi-modal" onchange="fiBusca()"><option value="">Todas as modalidades</option><option value="CredAluga">CredAluga</option><option value="Loft">Loft</option><option value="Seguro Fianca">Seguro Fianca</option></select>' +
          '<select class="filter-select" id="fi-chaves" onchange="fiBusca()"><option value="">Todas</option><option value="Sim">Chaves informadas</option><option value="Nao">Não informadas</option></select>' +
          '<span class="filter-count" id="fi-count">' + lista.length + ' contrato' + (lista.length !== 1 ? 's' : '') + '</span>' +
        '</div>' +
        '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Contrato</th><th>Endereço</th><th>Modalidade</th><th>Encerramento</th><th>Chaves informadas na plataforma</th><th>Responsável</th></tr></thead><tbody id="fi-tbody">' +
        (lista.length ? lista.map(function(item) {
          const encFormatted = item.enc ? item.enc.split('-').reverse().join('/') : '-';
          const chaveSim = item.chavesInformadas === 'Sim';
          const chaveHtml = canEdit ?
            '<select class="form-input form-select" style="width:80px;padding:6px 10px;font-size:12px;border-color:' + (chaveSim ? 'var(--success)' : 'var(--border-strong)') + ';color:' + (chaveSim ? 'var(--success)' : 'var(--fg)') + '" onchange="upChavesInformadas(\'' + item.contrato + '\',this.value)"><option ' + (!chaveSim?'selected':'') + '>Nao</option><option ' + (chaveSim?'selected':'') + '>Sim</option></select>' :
            '<span class="badge ' + (chaveSim ? 'badge-success' : 'badge-neutral') + '">' + (chaveSim ? 'Sim' : 'Não') + '</span>';
          const respHtml = canEdit ?
            '<input type="text" class="form-input" value="' + (item.responsavelFianca||'') + '" placeholder="Nome da responsável" style="min-width:150px;padding:6px 10px;font-size:12px" onchange="upResponsavelFianca(\'' + item.contrato + '\',this.value)">' :
            '<span style="font-size:13px">' + (item.responsavelFianca||'—') + '</span>';
          return '<tr><td><span class="badge badge-primary">' + item.contrato + '</span></td><td style="font-weight:600">' + item.end + '</td><td>' + modalBadge(item.modal) + '</td><td style="white-space:nowrap">' + encFormatted + '</td><td>' + chaveHtml + '</td><td>' + respHtml + '</td></tr>';
        }).join('') : '<tr><td colspan="6" style="padding:24px;color:var(--fg-subtle);text-align:center">Nenhum contrato encontrado.</td></tr>') +
        '</tbody></table></div>' +
      '</div>';
      showSidebar(false);

    function upChavesInformadas(contrato, valor) {
      const MODAIS_FIANCA = ['CredAluga', 'Loft', 'Seguro Fianca'];
      let saved = false;
      S.ags.forEach(function(a) {
        if (String(a.contrato) === String(contrato) && MODAIS_FIANCA.indexOf(a.modal) >= 0) {
          a.chavesInformadas = valor;
          dbSaveAg(a);
          saved = true;
        }
      });
      // Se não tem agendamento, salva no protocolo
      if (!saved) {
        S.prots.forEach(function(p) {
          if (String(p.contrato) === String(contrato) && MODAIS_FIANCA.indexOf(p.modal) >= 0) {
            p.chavesInformadas = valor;
            dbSaveProt(p);
          }
        });
      }
      addLog(contrato, 'Chaves informadas na plataforma: ' + valor, 'Por: ' + (S.user ? S.user.nome : '—'));
      showToast('Chaves ' + (valor === 'Sim' ? 'marcadas como informadas!' : 'marcadas como não informadas!'), 'success');
    }

    function upResponsavelFianca(contrato, valor) {
      const MODAIS_FIANCA = ['CredAluga', 'Loft', 'Seguro Fianca'];
      let saved = false;
      S.ags.forEach(function(a) {
        if (String(a.contrato) === String(contrato) && MODAIS_FIANCA.indexOf(a.modal) >= 0) {
          a.responsavelFianca = valor;
          dbSaveAg(a);
          saved = true;
        }
      });
      // Se não tem agendamento, salva no protocolo
      if (!saved) {
        S.prots.forEach(function(p) {
          if (String(p.contrato) === String(contrato) && MODAIS_FIANCA.indexOf(p.modal) >= 0) {
            p.responsavelFianca = valor;
            dbSaveProt(p);
          }
        });
      }
      addLog(contrato, 'Responsável Fiança: ' + valor, 'Por: ' + (S.user ? S.user.nome : '—'));
      showToast('Responsável salvo!', 'success');
    }

    function fiBusca() {
      const q = (document.getElementById('fi-q')||{value:''}).value.toLowerCase();
      const modal = (document.getElementById('fi-modal')||{value:''}).value;
      const chaves = (document.getElementById('fi-chaves')||{value:''}).value;
      const rows = document.querySelectorAll('#fi-tbody tr');
      let vis = 0;
      rows.forEach(function(row) {
        const txt = row.textContent.toLowerCase();
        const showQ = !q || txt.includes(q);
        const showM = !modal || txt.includes(modal.toLowerCase());
        const showC = !chaves || txt.includes(chaves.toLowerCase());
        const show = showQ && showM && showC;
        row.style.display = show ? '' : 'none';
        if (show) vis++;
      });

    function equipeLimpar() {
      ['eq-q','eq-colab','eq-status','eq-prazo'].forEach(function(id) { const el = document.getElementById(id); if (el) el.value = ''; });

    function equipeBusca() {
      const q = (document.getElementById('eq-q')||{value:''}).value.toLowerCase();
      const colab = (document.getElementById('eq-colab')||{value:''}).value;
      const status = (document.getElementById('eq-status')||{value:''}).value;
      const prazo = (document.getElementById('eq-prazo')||{value:''}).value;

      function calcPrazoEq(p) {
        if (!p.enc) return 99999;
        const prazoDias = (p.modal === 'CredAluga' || p.modal === 'Loft' || p.modal === 'Seguro Fianca') ? 30 : 45;
        return diasR(adD(p.enc, prazoDias));
      }

      let todos = S.prots.filter(function(p) {
        return p.colabDist && p.colabDist !== '' && p.colabDist !== 'Ja distribuido' && p.statusAcerto !== 'Finalizado';
      });

      if (q) todos = todos.filter(function(p) { return (p.contrato||'').toLowerCase().includes(q) || (p.end||'').toLowerCase().includes(q); });
      if (colab) todos = todos.filter(function(p) { return p.colabDist === colab; });
      if (status) todos = todos.filter(function(p) { return p.statusAcerto === status; });
      if (prazo) {
        todos = todos.filter(function(p) {
          const d = calcPrazoEq(p);
          if (prazo === 'vencido') return d < 0;
          if (prazo === 'alerta') return d >= 0 && d <= 10;
          if (prazo === 'ok') return d > 10;
          return true;
        });
      }

      todos.sort(function(a, b) { return calcPrazoEq(a) - calcPrazoEq(b); });

      const cnt = document.getElementById('eq-count');
      if (cnt) cnt.textContent = todos.length + ' contrato' + (todos.length !== 1 ? 's' : '');

      const tbody = document.getElementById('eq-tbody');
      if (!tbody) return;

      if (!todos.length) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><p>Nenhum contrato encontrado.</p></div></td></tr>';
        return;
      }

      tbody.innerHTML = todos.map(function(p) {
        const d = calcPrazoEq(p);
        let alertClass = 'prazo-ok', txt = '';
        if (d === 99999) { txt = 'Sem data'; alertClass = ''; }
        else if (d < 0) { txt = 'Vencido ' + Math.abs(d) + 'd'; alertClass = 'prazo-vencido'; }
        else { txt = d + 'd'; if (d <= 10) alertClass = 'prazo-alerta'; }
        const encFormatted = p.enc ? p.enc.split('-').reverse().join('/') : '-';
        let rowStyle = '';
        if (d < 0) rowStyle = 'background:rgba(220,38,38,0.05)';
        else if (d <= 7 && d >= 0) rowStyle = 'background:rgba(217,119,6,0.05)';

        return '<tr style="' + rowStyle + '">' +
          '<td><span class="badge badge-primary">' + p.contrato + '</span></td>' +
          '<td style="font-weight:600;max-width:200px">' + p.end + '</td>' +
          '<td><span class="badge badge-neutral">' + (p.modal||'-') + '</span></td>' +
          '<td><span style="font-weight:600">' + p.colabDist + '</span></td>' +
          '<td style="white-space:nowrap">' + encFormatted + '</td>' +
          '<td>' + (alertClass ? '<div class="prazo-alert ' + alertClass + '">' + txt + '</div>' : '<span style="color:var(--fg-subtle)">' + txt + '</span>') + '</td>' +
          '<td><select class="form-input form-select" style="width:145px" onchange="upEquipeSt(\'' + p.id + '\',this.value)"><option ' + (p.statusAcerto==='Encerrar aluguel'?'selected':'') + '>Encerrar aluguel</option><option ' + (p.statusAcerto==='Pendente'?'selected':'') + '>Pendente</option><option ' + (p.statusAcerto==='Em andamento'?'selected':'') + '>Em andamento</option><option value="Finalizado">Finalizado</option></select></td>' +
          '<td style="min-width:220px"><textarea class="form-input" onchange="upEquipeObs(\'' + p.id + '\',this.value)" placeholder="Observação..." style="min-height:60px;resize:vertical;font-size:12px">' + (p.obs||'') + '</textarea></td>' +
        '</tr>';
      }).join('');
    }

    function upEquipeSt(id, v) {
      const p = S.prots.find(function(x) { return x.id == id; });
      if (!p) return;
      if (v === 'Pendente' && p.statusAcerto !== 'Pendente') p.dataPendente = new Date().toISOString().split('T')[0];
      p.statusAcerto = v;
      addLog(p.contrato, 'Status alterado para "' + v + '" (via Equipe)', 'Por: ' + (S.user ? S.user.nome : '—'));
      dbSaveProt(p);
      showToast('Status atualizado!', 'success');
      if (v === 'Finalizado') equipeBusca();

    function upEquipeObs(id, v) {
      const p = S.prots.find(function(x) { return x.id == id; });

      p.obs = v;

      showToast('Observação salva!', 'success');
    }

    function renderTarefas(tarefas, n) {
      if (!tarefas.length) return '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><p>Nenhuma tarefa ainda. Adicione sua primeira!</p></div>';

      const concluidas = tarefas.filter(function(t) { return t.feita; });
      let html = '';
      if (pendentes.length) {
        html += '<div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--fg-subtle);text-transform:uppercase">Pendentes (' + pendentes.length + ')</div>';

        html += '<div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--fg-subtle);text-transform:uppercase">Concluídas (' + concluidas.length + ') <button class="btn btn-danger btn-sm" style="margin-left:8px" onclick="limparConcluidas()">Limpar</button></div>';

        '<span style="flex:1;font-size:14px;' + (t.feita ? 'text-decoration:line-through;color:var(--fg-muted)' : '') + '">' + t.texto + '</span>' +

      try { return JSON.parse(localStorage.getItem('tarefas_' + n) || '[]'); } catch(e) { return []; }

    function saveTarefas(tarefas) {
      try { localStorage.setItem('tarefas_' + S.user.nome, JSON.stringify(tarefas)); } catch(e) {}

    function refreshTarefas() {
      const n = S.user.nome;

    function addTarefa() {
      const input = document.getElementById('tarefa-input');
      if (!input || !input.value.trim()) { showToast('Digite uma tarefa', 'danger'); return; }
      const tarefas = getTarefas();
      tarefas.unshift({ id: Date.now(), texto: input.value.trim(), feita: false, data: new Date().toISOString().split('T')[0] });

      input.value = '';

      const tarefas = getTarefas();

      if (t) { t.feita = !t.feita; saveTarefas(tarefas); refreshTarefas(); }

      const tarefas = getTarefas().filter(function(x) { return String(x.id) !== String(id); });
      saveTarefas(tarefas);
      refreshTarefas();
      showToast('Tarefa removida!', 'success');
    }

      const tarefas = getTarefas().filter(function(t) { return !t.feita; });

    function fazerBackup() {
      showToast('Gerando backup...', 'success');
      const backup = {
        data: new Date().toISOString(),
        versao: '1.0',
        agendamentos: S.ags,
        protocolos: S.prots,
        finalizados: S.fins,
        usuarios: S.users,
        logs: S.logs,
        grade: S.grade
      };
      const json = JSON.stringify(backup, null, 2);
      const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const hoje = new Date().toISOString().split('T')[0];
      a.href = url;
      a.download = 'casanova-backup-' + hoje + '.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup salvo com sucesso!', 'success');
    }

    function importarBackup() {
      const input = document.getElementById('backup-file-input');
      if (input) input.click();
    }

    function processarImportacao(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const backup = JSON.parse(e.target.result);
          if (!backup.agendamentos || !backup.protocolos) {
            showToast('Arquivo de backup inválido!', 'danger');
            return;
          }
          showConfirm(
            'Importar Backup?',
            'Isso vai <strong>substituir todos os dados atuais</strong> pelo backup de <strong>' + (backup.data ? backup.data.split('T')[0] : 'data desconhecida') + '</strong>. Tem certeza?',
            async function() {
              showToast('Importando dados...', 'success');
              // Salva cada registro no Supabase
              const proms = [];
              if (backup.agendamentos) backup.agendamentos.forEach(function(a) { proms.push(sbUpsert('agendamentos', agToRow(a))); });
              if (backup.protocolos) backup.protocolos.forEach(function(p) { proms.push(sbUpsert('protocolos', protToRow(p))); });
              if (backup.finalizados) backup.finalizados.forEach(function(f) { proms.push(sbUpsert('finalizados', finToRow(f))); });
              if (backup.usuarios) backup.usuarios.forEach(function(u) { proms.push(dbSaveUser(u)); });
              await Promise.all(proms);
              // Recarrega estado
              await loadState();
              showToast('Backup importado com sucesso! ' + (backup.agendamentos||[]).length + ' agendamentos, ' + (backup.protocolos||[]).length + ' protocolos.', 'success');
              goTab('d1');
            }
          );
        } catch(err) {
          showToast('Erro ao ler o arquivo: ' + err.message, 'danger');
        }
        input.value = '';
      };
      reader.readAsText(file);
    }

    async function saveUser() {
      if (!S.user || S.user.role !== 'admin') { showToast('Apenas administradores podem cadastrar/editar usuarios', 'danger'); return; }
      const editId = document.getElementById('adm-edit-id').value;
      const nome = document.getElementById('adm-nome').value.trim();
      const login = document.getElementById('adm-login').value.trim();
      const senha = document.getElementById('adm-senha').value.trim();
      const role = document.getElementById('adm-role').value;
      if (!nome || !login || !senha) { showToast('Preencha todos os campos', 'danger'); return; }
      const exists = S.users.find(function(u) { return u.login === login && u.id != editId; });
      if (exists) { showToast('Login ja existe', 'danger'); return; }
      if (editId) {
        const user = S.users.find(function(u) { return u.id == editId; });
        if (user) {
          const nomeAntigo = user.nome;
          user.nome = nome; user.login = login; user.senha = senha; user.role = role;
          const nameParts = nome.split(' ');
          user.ini = nameParts.length > 1 ? (nameParts[0][0] + nameParts[nameParts.length-1][0]).toUpperCase() : nome.substring(0,2).toUpperCase();
          await dbSaveUser(user);

          // Se o nome mudou, atualiza colab_dist em todos os protocolos
          if (nomeAntigo !== nome) {
            const protosAffected = S.prots.filter(function(p) { return p.colabDist === nomeAntigo; });
            if (protosAffected.length > 0) {
              for (const p of protosAffected) {
                p.colabDist = nome;
                await dbSaveProt(p);
              }
              showToast('Usuario atualizado! ' + protosAffected.length + ' contrato(s) atualizados automaticamente.', 'success');
            } else {
              showToast('Usuario atualizado com sucesso!', 'success');
            }

            // Atualiza também finalizados
            const finsAffected = S.fins.filter(function(f) { return f.finalizadoPor === nomeAntigo; });
            for (const f of finsAffected) {
              f.finalizadoPor = nome;
              await dbSaveFin(f);
            }
          } else {
            showToast('Usuario atualizado com sucesso!', 'success');
          }
        }
      } else {
        const nameParts = nome.split(' ');
        const ini = nameParts.length > 1 ? (nameParts[0][0] + nameParts[nameParts.length-1][0]).toUpperCase() : nome.substring(0,2).toUpperCase();
        const novoUser = { id: Date.now(), nome: nome, login: login, senha: senha, role: role, cor: Math.floor(Math.random() * AVATAR_COLORS.length), ini: ini, ativo: true };
        S.users.push(novoUser);
        await dbSaveUser(novoUser);
        showToast('Usuario cadastrado com sucesso!', 'success');
      }
      clearAdmForm(); rAdm(document.getElementById('CNT'), document.getElementById('SB'));
    }

    function editUser(id) {
      if (!S.user || S.user.role !== 'admin') { showToast('Apenas administradores podem editar usuarios', 'danger'); return; }
      const user = S.users.find(function(u) { return u.id == id; });
      if (!user) return;
      document.getElementById('adm-edit-id').value = id;
      document.getElementById('adm-nome').value = user.nome;
      document.getElementById('adm-login').value = user.login;
      document.getElementById('adm-senha').value = user.senha;
      document.getElementById('adm-role').value = user.role;
      document.getElementById('adm-form-title').textContent = 'Editar Usuario';
      document.getElementById('adm-btn').textContent = 'Salvar';
      document.getElementById('adm-cancel-btn').style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearAdmForm() {
      document.getElementById('adm-edit-id').value = '';
      document.getElementById('adm-nome').value = '';
      document.getElementById('adm-login').value = '';
      document.getElementById('adm-senha').value = '';
      document.getElementById('adm-role').value = 'colaboradora';
      document.getElementById('adm-form-title').textContent = 'Cadastrar Novo Usuario';
      document.getElementById('adm-btn').textContent = 'Adicionar';
      document.getElementById('adm-cancel-btn').style.display = 'none';
    }

    function delUser(id) {
      if (!S.user || S.user.role !== 'admin') { showToast('Apenas administradores podem excluir usuarios', 'danger'); return; }
      if (S.user.id == id) { showToast('Voce nao pode excluir seu proprio usuario', 'danger'); return; }
      if (confirm('Tem certeza que deseja excluir este usuario?')) {
        var before = S.users.length;
        S.users = S.users.filter(function(u) { return u.id != id; });
        if (S.users.length < before) { dbDeleteUser(id); showToast('Usuario excluido com sucesso!', 'success'); clearAdmForm(); rAdm(document.getElementById('CNT'), document.getElementById('SB')); }
        else showToast('Nao foi possivel excluir o usuario.', 'warning');
      }
    }
